name: Deploy - coderider despliegue

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: desplegar a producción
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar y probar
        run: |
          npm install
          npm test

      - name: Desplegar aplicación
        run: |
          echo "iniciando despliegue de aplicación coderider v $(node -p \"require('./package.json').version\")"
          echo "sistema desplegado correctamente"
          echo "url: https://streamflow.example.com"